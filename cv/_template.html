<!doctype html>
<!--
  Template for an entry's own page. Copy it into cv/<section id>/ and name
  the copy <entry id>.html, e.g. cv/research/my-paper.html for the entry
  { id: "my-paper", ... } in the research section of cv/data.js. Then set
  `page: true` on that entry and replace the details below.

  You don't write the title, dates, photo, or links here: they come from the
  entry in data.js, so they always match the CV and projects pages.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- cv.js replaces this with the entry's title -->
    <title>cv | mrunalnshah</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../style.css" />
  </head>

  <body>
    <script src="../../nav.js"></script>

    <!-- Back links, photo, title, dates, and links come from cv/data.js: the
         entry in this folder's section whose id matches this file's name. -->
    <header id="cv-entry"></header>

    <!-- The details: write as much as you like below, in plain HTML. -->
    <article class="cv-body">
      <h3>overview,</h3>
      <p>What it is and why it matters.</p>

      <h3>what I did,</h3>
      <p>The approach: data, methods, architecture, decisions.</p>

      <!-- Images: put them in assets/cv/ and use a path from this page. -->
      <!-- <img src="../../assets/cv/your-figure.png" alt="What the figure shows" /> -->

      <h3>results,</h3>
      <p>Numbers, findings, what shipped, what you'd do differently.</p>
    </article>

    <script src="../data.js"></script>
    <script src="../cv.js"></script>
  </body>
</html>
