<svg xmlns="http://www.w3.org/2000/svg" width="700" height="140" viewBox="0 0 700 140"
     font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#111">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#111" />
    </marker>
  </defs>
  <rect x="10" y="20" width="100" height="100" fill="none" stroke="#111" />
  <text x="60.0" y="66.0" text-anchor="middle" font-weight="bold">structured</text>
  <text x="60.0" y="82.0" text-anchor="middle" fill="#555">text</text>
  <path d="M110 70 H133" fill="none" stroke="#111" marker-end="url(#arrow)" />
  <rect x="134" y="20" width="180" height="100" fill="none" stroke="#111" />
  <text x="224.0" y="42.0" text-anchor="middle" font-weight="bold">normalize</text>
  <text x="224.0" y="58.0" text-anchor="middle" fill="#555">fix hyphen line breaks</text>
  <text x="224.0" y="74.0" text-anchor="middle" fill="#555">remove noise (..., ---)</text>
  <text x="224.0" y="90.0" text-anchor="middle" fill="#555">collapse whitespace</text>
  <text x="224.0" y="106.0" text-anchor="middle" fill="#555">[XYZ] to [PLACEHOLDER]</text>
  <path d="M314 70 H337" fill="none" stroke="#111" marker-end="url(#arrow)" />
  <rect x="338" y="20" width="190" height="100" fill="none" stroke="#111" />
  <text x="433.0" y="50.0" text-anchor="middle" font-weight="bold">segment</text>
  <text x="433.0" y="66.0" text-anchor="middle" fill="#555">split at Section N,</text>
  <text x="433.0" y="82.0" text-anchor="middle" fill="#555">Rule N, Article N, (a)</text>
  <text x="433.0" y="98.0" text-anchor="middle" fill="#555">then drop the labels</text>
  <path d="M528 70 H551" fill="none" stroke="#111" marker-end="url(#arrow)" />
  <rect x="552" y="20" width="138" height="100" fill="none" stroke="#111" />
  <text x="621.0" y="58.0" text-anchor="middle" font-weight="bold">split into</text>
  <text x="621.0" y="74.0" text-anchor="middle" fill="#555">sentences</text>
  <text x="621.0" y="90.0" text-anchor="middle" fill="#555">(NLTK)</text>
</svg>
